<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohasin X Sensi - Best FF Settings</title>
    <style>
        /* CSS Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff4500;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #ff4500;
            margin-bottom: 20px;
            font-size: 28px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2d2d2d;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: #ff4500;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e63e00;
            transform: scale(1.02);
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #2d2d2d;
            border-radius: 10px;
            display: none;
            border: 1px solid #ff4500;
        }

        .sensi-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .val {
            color: #ff4500;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MOHASIN X SENSI</h1>
    
    <div class="input-group">
        <label>Phone Brand:</label>
        <select id="brand">
            <option value="samsung">Samsung</option>
            <option value="xiaomi">Xiaomi / Redmi</option>
            <option value="vivo">Vivo / Oppo</option>
            <option value="realme">Realme</option>
            <option value="iphone">iPhone</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div class="input-group">
        <label>RAM Size:</label>
        <select id="ram">
            <option value="2">2GB</option>
            <option value="3">3GB</option>
            <option value="4">4GB</option>
            <option value="6">6GB</option>
            <option value="8">8GB+</option>
        </select>
    </div>

    <div class="input-group">
        <label>Storage (ROM):</label>
        <select id="storage">
            <option value="32">32GB</option>
            <option value="64">64GB</option>
            <option value="128">128GB</option>
            <option value="256">256GB+</option>
        </select>
    </div>

    <button onclick="calculateSensi()">GENERATE CONFIG</button>

    <div id="result">
        <h3 style="margin-top:0;">Recommended Settings</h3>
        <div class="sensi-item"><span>General:</span> <span class="val" id="gen">--</span></div>
        <div class="sensi-item"><span>Red Dot:</span> <span class="val" id="red">--</span></div>
        <div class="sensi-item"><span>2x Scope:</span> <span class="val" id="s2x">--</span></div>
        <div class="sensi-item"><span>4x Scope:</span> <span class="val" id="s4x">--</span></div>
        <div class="sensi-item"><span>DPI:</span> <span class="val" id="dpi">--</span></div>
    </div>
</div>

<script>
    function calculateSensi() {
        const ram = parseInt(document.getElementById('ram').value);
        const resultDiv = document.getElementById('result');

        let general, redDot, scope2, scope4, dpi;

        // Logic based on RAM and Phone specs
        if (ram <= 3) {
            general = "100";
            redDot = "98";
            scope2 = "95";
            scope4 = "90";
            dpi = "450";
        } else if (ram <= 6) {
            general = "95";
            redDot = "92";
            scope2 = "88";
            scope4 = "85";
            dpi = "default";
        } else {
            general = "90";
            redDot = "85";
            scope2 = "80";
            scope4 = "75";
            dpi = "default";
        }

        // Display results
        document.getElementById('gen').innerText = general;
        document.getElementById('red').innerText = redDot;
        document.getElementById('s2x').innerText = scope2;
        document.getElementById('s4x').innerText = scope4;
        document.getElementById('dpi').innerText = dpi;

        resultDiv.style.display = 'block';
    }
</script>

</body>
</html>
