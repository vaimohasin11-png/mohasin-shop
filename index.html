<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOHASIN X SHOP</title>

<style>
body{
  background:black;
  color:white;
  font-family:monospace;
  text-align:center;
}

/* 🌈 Rainbow Text */
.rainbow{
  font-size:40px;
  font-weight:bold;
  background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: glow 2s infinite linear;
}
@keyframes glow{
  0%{filter:brightness(1);}
  50%{filter:brightness(2);}
  100%{filter:brightness(1);}
}

/* Container */
.container{
  max-width:400px;
  margin:auto;
}

/* Glory Image */
.glory img{
  width:100%;
  border-radius:10px;
  margin-top:15px;
}

/* Box */
.box{
  border:1px solid #00ffcc;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

/* Items */
.item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #333;
}
.item:last-child{border:none;}

.plan{font-weight:bold;}
.price{color:#00ff88;}

/* Button */
.buy{
  background: linear-gradient(45deg,#00ffcc,#ff00ff);
  border:none;
  padding:6px 12px;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.footer{
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<!-- 🌈 NAME -->
<h1 class="rainbow">MOHASIN X SHOP</h1>
<p>🔥 Welcome Mohasin 🔥</p>

<!-- 🖼️ GLORY IMAGE -->
<div class="glory">
  <img src="glory.jpg">
</div>

<!-- 💎 PRICE LIST -->
<div class="box">
  <h3>💎 Price List</h3>
  <p>4 BOT = 200 TK</p>
  <p>8 BOT = 400 TK</p>
  <p>20 BOT = 1000 TK</p>
  <p>24 BOT = 1200 TK</p>
</div>

<!-- 🛒 ORDER SYSTEM -->
<div class="box">
  <h3>🛒 Order Now</h3>

  <div class="item">
    <span class="plan">4 BOT</span>
    <span class="price">200 TK</span>
    <button class="buy" onclick="orderNow('4 BOT - 200 TK')">Buy</button>
  </div>

  <div class="item">
    <span class="plan">8 BOT</span>
    <span class="price">400 TK</span>
    <button class="buy" onclick="orderNow('8 BOT - 400 TK')">Buy</button>
  </div>

  <div class="item">
    <span class="plan">20 BOT</span>
    <span class="price">1000 TK</span>
    <button class="buy" onclick="orderNow('20 BOT - 1000 TK')">Buy</button>
  </div>

  <div class="item">
    <span class="plan">24 BOT</span>
    <span class="price">1200 TK</span>
    <button class="buy" onclick="orderNow('24 BOT - 1200 TK')">Buy</button>
  </div>

</div>

<!-- FOOTER -->
<div class="footer">
  🔥 MOHASIN X SHOP 🔥
</div>

</div>

<!-- 📲 WhatsApp Script -->
<script>
function orderNow(packageName){
    let number = "8801771554345"; // 👉 তোমার নাম্বার বসাও
    
    let message = `🔥 FF GUILD GLORY ORDER 🔥%0A
🛒 Package: ${packageName}%0A
👤 Name:%0A
🎮 UID:%0A
💰 Payment: BKash/Nagad`;

    let url = `https://wa.me/${number}?text=${message}`;
    window.open(url, '_blank');
}
</script>

</body>
</html>
