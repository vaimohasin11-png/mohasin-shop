<!DOCTYPE html>
<html>
<head>
<title>MOHASIN X SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0d0d1a;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

.header{
  padding:15px;
  background:#14142b;
}

.card{
  background:#1a1a2e;
  margin:20px;
  padding:20px;
  border-radius:15px;
}

img{
  width:80%;
  border-radius:15px;
  cursor:pointer;
  transition:0.3s;
}

img:hover{
  transform:scale(1.05);
}

/* hidden box */
#info{
  display:none;
  margin-top:20px;
  background:#111;
  padding:15px;
  border-radius:10px;
}

.price{
  margin:5px;
  padding:10px;
  background:#222;
  border-radius:8px;
}
</style>

</head>

<body>

<div class="header">
<h2>🔥 MOHASIN X SHOP 🔥</h2>
</div>

<div class="card">

<!-- তোমার image -->
<img src="logo.png" onclick="showInfo()">

<h3>👆 Click Image to See Price</h3>

<div id="info">

<h3>💎 DRIP CLIENT PRICE</h3>

<div class="price">1 DAY - 100TK</div>
<div class="price">3 DAY - 210TK</div>
<div class="price">7 DAY - 410TK</div>
<div class="price">15 DAY - 720TK</div>
<div class="price">30 DAY - 1040TK</div>

<h3>💳 Payment (bKash)</h3>
<p>📱 01772554345</p>

<button onclick="order()">🛒 Order Now (WhatsApp)</button>

</div>

</div>

<script>

/* show / hide */
function showInfo(){
let box = document.getElementById("info");

if(box.style.display=="block"){
  box.style.display="none";
}else{
  box.style.display="block";
}
}

/* WhatsApp */
function order(){

let name = prompt("Your Name:");
let plan = prompt("Enter Plan (1day / 3day etc):");

let number = "8801772554345";

let msg = "🔥 MOHASIN X SHOP 🔥\nName: "+name+"\nPlan: "+plan;

let url = "https://wa.me/"+number+"?text="+encodeURIComponent(msg);

window.open(url);

}

</script>

</body>
</html>
