<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohasin X Sensi & Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .panel-container {
            background: #111;
            width: 320px;
            border-radius: 15px;
            border: 2px solid #ff4500;
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.5);
            overflow: hidden;
        }

        .panel-header {
            background: #ff4500;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            color: black;
        }

        .panel-body {
            padding: 20px;
        }

        .function-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
        }

        .function-name {
            font-size: 14px;
            color: #eee;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 45px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #ff4500;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        .status-log {
            font-size: 11px;
            color: #ffcc00;
            text-align: center;
            margin-top: 10px;
            height: 15px;
        }

        .inject-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #ff4500;
            color: #ff4500;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .inject-btn:hover {
            background: #ff4500;
            color: black;
        }
    </style>
</head>
<body>

<div class="panel-container">
    <div class="panel-header">MOHASIN X PANEL V1</div>
    
    <div class="panel-body">
        
        <div class="function-item">
            <span class="function-name">ESP Location</span>
            <label class="switch">
                <input type="checkbox" onchange="toggleHack('ESP Location', this)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="function-item">
            <span class="function-name">Hologram View</span>
            <label class="switch">
                <input type="checkbox" onchange="toggleHack('Hologram', this)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="function-item">
            <span class="function-name">90% Drag Headshot</span>
            <label class="switch">
                <input type="checkbox" onchange="toggleHack('Drag Headshot', this)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="function-item">
            <span class="function-name">Aim Lock (Legit)</span>
            <label class="switch">
                <input type="checkbox" onchange="toggleHack('Aim Lock', this)">
                <span class="slider"></span>
            </label>
        </div>

        <div id="status" class="status-log">Waiting for connection...</div>
        
        <button class="inject-btn" onclick="inject()">INJECT NOW</button>
    </div>
</div>

<script>
    function toggleHack(name, element) {
        let status = document.getElementById('status');
        if (element.checked) {
            status.innerText = name + " Activated!";
            status.style.color = "#00ffcc";
        } else {
            status.innerText = name + " Deactivated.";
            status.style.color = "#ff4500";
        }
    }

    function inject() {
        let status = document.getElementById('status');
        status.innerText = "Injecting Modules...";
        status.style.color = "white";
        
        setTimeout(() => {
            status.innerText = "Bypass Anti-Ban: Success!";
            alert("All Functions Injected Successfully!");
        }, 2000);
    }
</script>

</body>
</html>
