<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHASIN | EXPLOIT CENTER</title>
    <style>
        /* Hacking Style Theme */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden; /* ব্যাকগ্রাউন্ড অ্যানিমেশনের জন্য */
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 1;
            margin: 100px auto;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 1px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-bottom: 1px solid #fff;
            padding-bottom: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #fff;
            transition: 0.4s;
            cursor: pointer;
        }

        .btn:hover {
            background: #000;
            color: #fff;
            box-shadow: 0 0 15px #fff;
        }

        /* Admin Login */
        .admin-section {
            margin-top: 50px;
            font-size: 10px;
            color: #444;
            cursor: pointer;
        }

        input {
            background: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            margin: 5px 0;
            width: 90%;
            outline: none;
        }

        input:focus {
            border-color: #fff;
        }

        #admin-panel, #login-form {
            display: none;
            margin-top: 20px;
            border-top: 1px dashed #444;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <!-- হ্যাকিং ব্যাকগ্রাউন্ড ম্যাট্রিক্স ইফেক্ট -->
    <canvas id="matrix"></canvas>

    <div class="container">
        <p style="font-size: 12px; color: #888;">[ SYSTEM STATUS: ONLINE ]</p>
        <h1 id="file-title">PRIVATE EXPLOIT</h1>
        
        <div id="download-area">
            <!-- তোমার মিডিয়াফায়ার লিঙ্ক এখানে অটো আপডেট হবে -->
            <a href="তোমার_লিঙ্ক_এখানে" id="file-link" class="btn">INITIALIZE DOWNLOAD</a>
        </div>

        <div class="admin-section" onclick="toggleLogin()">ACCESS SYSTEM CORE</div>

        <!-- লগইন ফর্ম -->
        <div id="login-form">
            <input type="text" id="user" placeholder="USERNAME">
            <input type="password" id="pass" placeholder="PASSWORD">
            <button class="btn" style="padding: 5px 15px; font-size: 12px;" onclick="doLogin()">LOGIN</button>
        </div>

        <!-- অ্যাডমিন কন্ট্রোল প্যানেল -->
        <div id="admin-panel">
            <h3>ROOT ACCESS GRANTED</h3>
            <input type="text" id="new-name" placeholder="ফাইলের নাম">
            <input type="text" id="new-url" placeholder="মিডিয়াফায়ার ইউআরএল">
            <button class="btn" style="padding: 5px 15px; font-size: 12px;" onclick="updateSystem()">UPDATE DATABASE</button>
        </div>
    </div>

    <script>
        // ব্যাকগ্রাউন্ড ম্যাট্রিক্স অ্যানিমেশন
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff"; // হোয়াইট হ্যাকিং কালার
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // লগইন এবং ফাইল আপডেট লজিক
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "moha";

        function toggleLogin() {
            document.getElementById('login-form').style.display = 'block';
        }

        function doLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                alert("ACCESS GRANTED, WELCOME MOHASIN.");
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                alert("ACCESS DENIED!");
            }
        }

        function updateSystem() {
            const name = document.getElementById('new-name').value;
            const url = document.getElementById('new-url').value;
            if (name) document.getElementById('file-title').innerText = name;
            if (url) document.getElementById('file-link').href = url;
            alert("SYSTEM UPDATED!");
            document.getElementById('admin-panel').style.display = 'none';
        }
    </script>
</body>
</html>
