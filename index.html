<!DOCTYPE html>
<html>
<head>
<title>MOHASIN X SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background:#0d0d1a;color:white;font-family:sans-serif;text-align:center;}
.header{padding:15px;background:#14142b;}
.card{background:#1a1a2e;margin:15px;padding:15px;border-radius:15px;}
.btn{padding:12px;margin:6px;border:none;border-radius:10px;color:white;width:90%;}
.login{background:#4285F4;}
.deposit{background:#00cc66;}
.buy{background:#ff00aa;}
.admin{background:#ffaa00;}
.pricebtn{background:#7a5cff;}
.list{display:none;margin-top:10px;}
.item{background:#111;margin:6px;padding:10px;border-radius:8px;}
img{width:90%;border-radius:12px;}
</style>

</head>

<body>

<div class="header">
<h2>🔥 MOHASIN X SHOP 🔥</h2>
<button class="btn login" onclick="login()">🔐 Login with Gmail</button>
<p id="user"></p>
</div>

<div class="card">

<img src="logo.png">

<h3>💎 DRIP CLIENT PANEL</h3>

<button class="btn pricebtn" onclick="toggle()">📊 View Price List</button>

<div class="list" id="list">
<div class="item">1 DAY - 100TK <button onclick="order('1 DAY - 100TK')">Buy</button></div>
<div class="item">3 DAY - 210TK <button onclick="order('3 DAY - 210TK')">Buy</button></div>
<div class="item">7 DAY - 410TK <button onclick="order('7 DAY - 410TK')">Buy</button></div>
<div class="item">15 DAY - 720TK <button onclick="order('15 DAY - 720TK')">Buy</button></div>
<div class="item">30 DAY - 1040TK <button onclick="order('30 DAY - 1040TK')">Buy</button></div>
</div>

<button class="btn deposit" onclick="deposit()">💳 Deposit</button>

</div>

<button class="btn admin" onclick="loadAdmin()">📊 Admin Panel</button>

<div id="adminPanel"></div>

<!-- 🔥 FIREBASE FULL SYSTEM -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, addDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZxhdeUPoOEpNz3CD4A6yOrwD0lTGgrw4",
  authDomain: "mohasin-shop-965d2.firebaseapp.com",
  projectId: "mohasin-shop-965d2",
  storageBucket: "mohasin-shop-965d2.firebasestorage.app",
  messagingSenderId: "820549153329",
  appId: "1:820549153329:web:0752cb58a547db7ed75b10",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const db = getFirestore();

let currentUser = null;

/* 🔐 LOGIN */
window.login = function(){
  signInWithPopup(auth, provider)
  .then(result=>{
    currentUser = result.user;
    document.getElementById("user").innerText =
      "👤 " + currentUser.email;
  });
}

/* 💳 DEPOSIT */
window.deposit = async function(){
  if(!currentUser){
    alert("Login first ❌");
    return;
  }

  let amount = prompt("Enter amount:");

  await addDoc(collection(db, "deposit"), {
    amount: amount,
    user: currentUser.email,
    time: new Date()
  });

  alert("Deposit Saved ✅");
}

/* 📊 ADMIN PANEL */
window.loadAdmin = async function(){

  if(!currentUser){
    alert("Login first ❌");
    return;
  }

  if(currentUser.email !== "vaimohasin11@gmail.com"){
    alert("Access Denied ❌");
    return;
  }

  let data = await getDocs(collection(db, "deposit"));

  let html = "<h3>📊 Deposits</h3>";

  data.forEach(doc=>{
    let d = doc.data();
    html += `<p>👤 ${d.user} | 💰 ${d.amount}</p>`;
  });

  document.getElementById("adminPanel").innerHTML = html;
}

</script>

<!-- NORMAL JS -->
<script>
function toggle(){
let x=document.getElementById("list");
x.style.display = x.style.display=="block" ? "none" : "block";
}

function order(plan){
let number="8801772554345";
let msg="🔥 MOHASIN X SHOP 🔥%0A"+plan;
window.open("https://wa.me/"+number+"?text="+msg);
}
</script>

</body>
</html>
