<!DOCTYPE html>
<html>
<head>
<title>MOHASIN X SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background:#0d0d1a;color:white;font-family:sans-serif;text-align:center;}
.header{padding:15px;background:#14142b;}
.card{background:#1a1a2e;margin:15px;padding:15px;border-radius:15px;}
.btn{padding:12px;margin:6px;border:none;border-radius:10px;color:white;width:90%;}
.pricebtn{background:#7a5cff;}
.deposit{background:#00cc66;}
.admin{background:#ffaa00;}
.approve{background:#00cc66;}
.delete{background:#ff4444;}
.item{background:#111;margin:6px;padding:10px;border-radius:8px;}
.list{display:none;margin-top:10px;}
img{width:90%;border-radius:12px;}
.balanceBox{background:#000;padding:10px;margin:10px;border-radius:10px;}
</style>

</head>

<body>

<div class="header">
<h2>🔥 MOHASIN X SHOP 🔥</h2>

<div class="balanceBox">
👤 <span id="username">Not Set</span><br>
💰 Balance: <span id="balance">0</span> TK
</div>

<button class="btn" onclick="setName()">👤 Set Name</button>
<button class="btn" onclick="refreshBalance()">🔄 Refresh Balance</button>

</div>

<div class="card">

<img src="logo.png">

<h3>💎 DRIP CLIENT PANEL</h3>

<button class="btn pricebtn" onclick="toggle()">📊 View Price List</button>

<div class="list" id="list">
<div class="item">1 DAY - 100TK <button onclick="buy('1 DAY - 100TK')">Buy</button></div>
<div class="item">3 DAY - 210TK <button onclick="buy('3 DAY - 210TK')">Buy</button></div>
<div class="item">7 DAY - 410TK <button onclick="buy('7 DAY - 410TK')">Buy</button></div>
<div class="item">15 DAY - 720TK <button onclick="buy('15 DAY - 720TK')">Buy</button></div>
<div class="item">30 DAY - 1040TK <button onclick="buy('30 DAY - 1040TK')">Buy</button></div>
</div>

<button class="btn deposit" onclick="deposit()">💳 Deposit</button>

</div>

<button class="btn admin" onclick="admin()">📊 Admin Panel</button>
<div id="adminPanel"></div>

<!-- 🔥 FIREBASE FULL SYSTEM -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, addDoc, collection, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZxhdeUPoOEpNz3CD4A6yOrwD0lTGgrw4",
  authDomain: "mohasin-shop-965d2.firebaseapp.com",
  projectId: "mohasin-shop-965d2",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore();

/* 👤 NAME */
window.setName = function(){
  let name = prompt("Enter your name:");
  localStorage.setItem("user", name);
  document.getElementById("username").innerText = name;
}

/* Load Name */
let user = localStorage.getItem("user");
if(user){
  document.getElementById("username").innerText = user;
}

/* 💳 Deposit */
window.deposit = async function(){
  let name = localStorage.getItem("user");
  if(!name){ alert("Set name first ❌"); return; }

  let amount = prompt("Enter amount:");

  await addDoc(collection(db,"deposit"),{
    name:name,
    amount:Number(amount),
    status:"Pending"
  });

  alert("Deposit Sent ✅");
}

/* 💰 Balance */
window.refreshBalance = async function(){
  let name = localStorage.getItem("user");
  if(!name){ alert("Set name first ❌"); return; }

  let data = await getDocs(collection(db,"deposit"));
  let total=0;

  data.forEach(d=>{
    let x=d.data();
    if(x.name==name && x.status=="Approved"){
      total+=x.amount;
    }
  });

  document.getElementById("balance").innerText = total;
}

/* 🛒 BUY */
window.buy = async function(plan){

  let name = localStorage.getItem("user");
  if(!name){ alert("Set name first ❌"); return; }

  let price={
    "1 DAY - 100TK":100,
    "3 DAY - 210TK":210,
    "7 DAY - 410TK":410,
    "15 DAY - 720TK":720,
    "30 DAY - 1040TK":1040
  };

  let cost=price[plan];

  let data = await getDocs(collection(db,"deposit"));
  let total=0;

  data.forEach(d=>{
    let x=d.data();
    if(x.name==name && x.status=="Approved"){
      total+=x.amount;
    }
  });

  if(total < cost){
    alert("❌ Not enough balance");
    return;
  }

  alert("✅ Order Success");

  let number="8801772554345";
  let msg="🔥 MOHASIN X SHOP 🔥%0AOrder: "+plan+" | Name: "+name;

  window.open("https://wa.me/"+number+"?text="+msg);
}

/* 📊 ADMIN */
window.admin = async function(){

  let pass=prompt("Admin password:");
  if(pass!="1234"){ alert("Wrong ❌"); return; }

  let data = await getDocs(collection(db,"deposit"));
  let html="<h3>📊 Admin Panel</h3>";

  data.forEach(d=>{
    let id=d.id;
    let x=d.data();

    html+=`
    <div class="item">
    👤 ${x.name} | 💰 ${x.amount} | ${x.status}<br>
    <button class="approve" onclick="approve('${id}')">Approve</button>
    <button class="delete" onclick="remove('${id}')">Delete</button>
    </div>`;
  });

  document.getElementById("adminPanel").innerHTML=html;
}

/* ✅ APPROVE */
window.approve = async function(id){
  await updateDoc(doc(db,"deposit",id),{status:"Approved"});
  admin();
}

/* ❌ DELETE */
window.remove = async function(id){
  await deleteDoc(doc(db,"deposit",id));
  admin();
}

</script>

<script>
function toggle(){
let x=document.getElementById("list");
x.style.display = x.style.display=="block" ? "none" : "block";
}
</script>

</body>
</html>
