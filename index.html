<!DOCTYPE html>
<html>
<head>
<title>MOHASIN X SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0d0d1a;
  font-family:sans-serif;
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#14142b;
}

.header h2{
  color:#fff;
}

.container{
  padding:10px;
}

.card{
  background:#1a1a2e;
  border-radius:15px;
  padding:10px;
  margin-bottom:15px;
  box-shadow:0 0 10px #000;
}

.card img{
  width:100%;
  border-radius:10px;
}

.title{
  font-size:18px;
  margin-top:8px;
}

.price{
  color:#00ff99;
  margin-top:5px;
}

.btn{
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  width:48%;
}

.buy{
  background:#7a5cff;
  color:white;
}

.demo{
  background:#ff4444;
  color:white;
}

.row{
  display:flex;
  justify-content:space-between;
}
</style>

</head>

<body>

<div class="header">
<h2>🔥 MOHASIN X SHOP</h2>
</div>

<div class="container">

<!-- CARD 1 -->
<div class="card">
<img src="logo.png">
<div class="title">💎 DRIP CLIENT PANEL</div>
<div class="price">From 100 TK</div>

<div class="row">
<button class="btn demo">Demo</button>
<button class="btn buy" onclick="buy()">Buy</button>
</div>
</div>

<!-- CARD 2 -->
<div class="card">
<img src="logo.png">
<div class="title">⚡ VIP PANEL</div>
<div class="price">From 200 TK</div>

<div class="row">
<button class="btn demo">Demo</button>
<button class="btn buy" onclick="buy()">Buy</button>
</div>
</div>

</div>

<script>
function buy(){
let number="8801772554345";

let msg="MOHASIN X SHOP ORDER%0APlease send panel details";

window.open("https://wa.me/"+number+"?text="+msg);
}
</script>

</body>
</html>
