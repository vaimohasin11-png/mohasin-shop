<!DOCTYPE html>
<html>
<head>
<title>MOHASIN X SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0b0b1a;
  font-family:sans-serif;
  color:white;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
  background:#12122a;
}

.header h2{
  font-size:18px;
}

.container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:#1a1a2e;
  border-radius:15px;
  padding:10px;
  box-shadow:0 0 10px #000;
}

.card img{
  width:100%;
  border-radius:10px;
}

.title{
  font-weight:bold;
  margin-top:8px;
}

.tag{
  font-size:12px;
  color:#aaa;
}

.price{
  color:#00ffcc;
  margin-top:5px;
}

.btns{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.btn{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.demo{background:red;}
.buy{background:#7a5cff;}
</style>

</head>

<body>

<div class="header">
<h2>🔥 MOHASIN X SHOP</h2>
</div>

<div class="container">

<!-- CARD 1 -->
<div class="card">
<img src="https://i.ibb.co/0y7s9YB/ff.jpg">
<div class="title">DRIP CLIENT</div>
<div class="tag">Freefire panel</div>
<div class="price">From 100 TK</div>

<div class="btns">
<button class="btn demo">Demo</button>
<button class="btn buy" onclick="order('DRIP CLIENT')">Buy</button>
</div>
</div>

<!-- CARD 2 -->
<div class="card">
<img src="https://i.ibb.co/q7G5X9C/carro.jpg">
<div class="title">CARROM HACK</div>
<div class="tag">Auto aim panel</div>
<div class="price">From 200 TK</div>

<div class="btns">
<button class="btn demo">Demo</button>
<button class="btn buy" onclick="order('CARROM HACK')">Buy</button>
</div>
</div>

</div>

<script>
function order(name){
let number="8801772554345";
let msg="MOHASIN X SHOP%0AProduct: "+name;

window.open("https://wa.me/"+number+"?text="+msg);
}
</script>

</body>
</html>
