<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire File Download Center</title>
    <!-- Google Fonts ব্যবহার করা হয়েছে সুন্দর দেখানোর জন্য -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS অংশ - ডিজাইন করার জন্য */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .download-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #334155;
        }

        .file-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h2 {
            margin: 10px 0;
            color: #38bdf8;
        }

        .file-info {
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
            text-align: left;
        }

        .file-info p {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }

        .file-info span {
            color: #94a3b8;
        }

        /* ডাউনলোড বাটন স্টাইল */
        .download-btn {
            display: block;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="download-card">
        <div class="file-icon">📁</div>
        <h2>Free Fire Mod/Config</h2>
        <p style="color: #94a3b8;">নিচের বাটন থেকে আপনার ফাইলটি ডাউনলোড করুন</p>

        <!-- ফাইলের তথ্য টেবিল -->
        <div class="file-info">
            <p><span>File Name:</span> <strong>Free_Fire_Vip.zip</strong></p>
            <p><span>Size:</span> <strong>15.5 MB</strong></p>
            <p><span>Version:</span> <strong>Latest</strong></p>
            <p><span>Uploader:</span> <strong>Your Name</strong></p>
        </div>

        <!-- ডাউনলোড লিংক এখানে বসান -->
        <a href="আপনার_মিডিয়াফায়ার_লিঙ্ক_এখানে_দিন" class="download-btn" target="_blank">
            DOWNLOAD NOW
        </a>

        <p class="footer-text">Security Verified by MediaFire</p>
    </div>

</body>
</html>
