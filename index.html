<!DOCTYPE html>
<html>
<head>
<title>MOHASIN X SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Login -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{background:#0d0d1a;color:white;font-family:sans-serif;margin:0;}
.header{padding:15px;text-align:center;background:#14142b;}
.card{background:#1a1a2e;margin:15px;padding:10px;border-radius:15px;}
.card img{width:100%;border-radius:10px;}
.btn{padding:10px;margin-top:10px;border:none;border-radius:8px;width:100%;color:white;}
.pricebtn{background:#7a5cff;}
.buy{background:#ff00aa;}
.deposit{background:#00cc66;}
.list{display:none;margin-top:10px;}
.item{background:#111;margin:5px 0;padding:10px;border-radius:8px;display:flex;justify-content:space-between;}
</style>
</head>

<body>

<div class="header">
<h2>🔥 MOHASIN X SHOP 🔥</h2>

<!-- Google Login -->
<div id="g_id_onload"
 data-client_id="YOUR_CLIENT_ID"
 data-callback="handleCredentialResponse">
</div>
<div class="g_id_signin"></div>

</div>

<div class="card">

<img src="logo.png">

<h3>💎 DRIP CLIENT PANEL</h3>

<button class="btn pricebtn" onclick="toggle()">📊 View Price List</button>

<div class="list" id="list">
<div class="item">1 DAY - 100TK <button onclick="order('1 DAY - 100TK')">Buy</button></div>
<div class="item">3 DAY - 210TK <button onclick="order('3 DAY - 210TK')">Buy</button></div>
<div class="item">7 DAY - 410TK <button onclick="order('7 DAY - 410TK')">Buy</button></div>
<div class="item">15 DAY - 720TK <button onclick="order('15 DAY - 720TK')">Buy</button></div>
<div class="item">30 DAY - 1040TK <button onclick="order('30 DAY - 1040TK')">Buy</button></div>
</div>

<button class="btn deposit" onclick="deposit()">💳 Deposit</button>

</div>

<script>
// Toggle Price List
function toggle(){
let x=document.getElementById("list");
x.style.display = x.style.display=="block" ? "none" : "block";
}

// WhatsApp Order
function order(plan){
let number="8801772554345";

let msg="🔥 MOHASIN X SHOP 🔥%0A%0A"+
"Panel: DRIP CLIENT%0A"+
"Plan: "+plan+"%0A%0A"+
"bKash: 01772554345%0AConfirm Order";

window.open("https://wa.me/"+number+"?text="+msg);
}

// Deposit
function deposit(){
let number="8801772554345";

let msg="💳 DEPOSIT REQUEST%0A%0A"+
"bKash Number: 01772554345%0A"+
"Amount: ___%0A%0A"+
"Send payment screenshot";

window.open("https://wa.me/"+number+"?text="+msg);
}

// Google Login
function handleCredentialResponse(response){
alert("Login Success ✅");
}
</script>

</body>
</html>
