<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MOHASIN FF TOOL PANEL</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center}
.rainbow{font-size:34px;font-weight:bold;animation:rb 5s infinite}
@keyframes rb{0%{color:red}25%{color:yellow}50%{color:green}75%{color:cyan}100%{color:magenta}}
.card{background:#1a1a1a;margin:12px;padding:16px;border-radius:14px;box-shadow:0 0 12px #00ffcc}
input,select{padding:8px;border-radius:8px;border:none;margin:5px}
button{padding:8px 14px;border:none;border-radius:10px;background:#00ffcc;font-weight:bold;cursor:pointer}
table{width:90%;margin:auto;border-collapse:collapse}
td,th{border:1px solid #00ffcc;padding:6px}
</style>
</head>
<body>

<h1 class="rainbow">MOHASIN FF TOOL PANEL</h1>

<div class="card">
<h3>🎯 Sensitivity Preset</h3>
<input id="gen" placeholder="General">
<input id="red" placeholder="Red Dot">
<input id="sc2" placeholder="2x">
<button onclick="saveSens()">Save</button>
</div>

<div class="card">
<h3>⏱️ Practice Timer</h3>
<select id="mins">
  <option>5</option><option>10</option><option>15</option>
</select>
<button onclick="startTimer()">Start</button>
<p id="timer"></p>
</div>

<div class="card">
<h3>📊 Match Stats</h3>
<input id="kills" placeholder="Kills">
<input id="hs" placeholder="Headshots">
<button onclick="addStat()">Add</button>
<div id="stats"></div>
</div>

<script>
function saveSens(){
  let s = {
    gen: gen.value, red: red.value, sc2: sc2.value
  };
  localStorage.setItem("sens", JSON.stringify(s));
  alert("Saved!");
}

function startTimer(){
  let t = mins.value * 60;
  let i = setInterval(()=>{
    let m = Math.floor(t/60), s = t%60;
    timer.innerText = m+":"+ (s<10?"0":"")+s;
    t--;
    if(t<0){clearInterval(i); alert("Done!");}
  },1000);
}

function addStat(){
  let k = Number(kills.value||0);
  let h = Number(hs.value||0);
  let arr = JSON.parse(localStorage.getItem("stats")||"[]");
  arr.push({k,h,time:new Date().toLocaleString()});
  localStorage.setItem("stats", JSON.stringify(arr));
  showStats();
}

function showStats(){
  let arr = JSON.parse(localStorage.getItem("stats")||"[]");
  let html = "<table><tr><th>K</th><th>HS</th><th>Time</th></tr>";
  arr.forEach(x=> html += `<tr><td>${x.k}</td><td>${x.h}</td><td>${x.time}</td></tr>`);
  html += "</table>";
  stats.innerHTML = html;
}
showStats();
</script>

</body>
</html>
